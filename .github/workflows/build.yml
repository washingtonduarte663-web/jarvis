name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build APK
        run: |
          flutter create --project-name jarvis --platforms=android temp_build
          cp lib/main.dart temp_build/lib/main.dart
          cp pubspec.yaml temp_build/pubspec.yaml
          cd temp_build
          flutter pub get
          flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: temp_build/build/app/outputs/flutter-apk/app-debug.apk
